name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test ZekPcSayac.slnx --configuration Release

      - name: Publish
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          dotnet publish ZekPcSayac/ZekPcSayac.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=$version -o publish
          Copy-Item scripts publish/scripts -Recurse
          Set-Content publish/version.txt "${{ github.ref_name }}" -NoNewline
          Compress-Archive -Path publish/* -DestinationPath ZekPcSayac-win-x64.zip

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ZekPcSayac-win-x64.zip
          generate_release_notes: true
